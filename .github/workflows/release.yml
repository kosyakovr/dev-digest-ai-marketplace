name: Release channels

# After a merge to main (docs/specs/release-channels.md):
# - latest: regenerate branch `latest` from this commit (R4, R5).
# - stable: tag `<plugin>--v<version>` at each pinned commit that has no tag
#   yet, which happens only after a promotion (R12).
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-channels
  cancel-in-progress: false

env:
  CLAUDE_CLI_VERSION: "2.1.296"
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  latest:
    name: Publish branch latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Build and push latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin latest || true   # absent before the first run
          # Prints the commit only after check_marketplace.py and validate --strict pass on it.
          commit="$(bash scripts/build_latest_branch.sh "${GITHUB_SHA}")"
          git push origin "${commit}:refs/heads/latest"

  tags:
    name: Tag stable releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag each pinned version that has no tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY' > "${RUNNER_TEMP}/pins.tsv"
          import json, sys
          sys.path.insert(0, "scripts")
          import channels
          from pathlib import Path
          catalog = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          for entry in catalog["plugins"]:
              if channels.is_pin(entry):
                  sha = entry["source"]["sha"]
                  manifest = channels.manifest_at(Path("."), sha, entry["name"])
                  print(f"{entry['name']}\t{manifest['version']}\t{sha}")
          PY
          while IFS=$'\t' read -r name version sha; do
            tag="${name}--v${version}"
            if existing="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
              [ "${existing}" = "${sha}" ] || echo "::warning::${tag} already points at ${existing:0:12}, not the pinned ${sha:0:12}"
              continue
            fi
            git tag -a "${tag}" "${sha}" -m "${name} ${version}"
            git push origin "refs/tags/${tag}"
            echo "tagged ${tag} at ${sha:0:12}"
          done < "${RUNNER_TEMP}/pins.tsv"
