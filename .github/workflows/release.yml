name: Tag plugin releases

# After a merge to main, create a `<plugin>--v<version>` tag for every plugin
# whose current version is not tagged yet. Tags let dependents pin semver ranges
# and give each plugin its own release history.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

env:
  CLAUDE_CLI_VERSION: "2.1.296"
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  tag:
    name: Tag new plugin versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Create missing tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in plugins/*/; do
            name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "${dir}.claude-plugin/plugin.json")"
            version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "${dir}.claude-plugin/plugin.json")"
            tag="${name}--v${version}"
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists, skipping"
              continue
            fi
            claude plugin tag "${dir}" --push -m "${name} %s"
          done
