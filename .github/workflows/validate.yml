name: Validate marketplace

# No `paths:` filter on purpose: this is a required check, and a filtered-out
# PR would leave it stuck in "Expected — Waiting".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose; bump deliberately after checking the changelog.
  CLAUDE_CLI_VERSION: "2.1.296"
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version-bump check needs the base branch history
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          claude --version

      - name: Policy checks (sources, names, versions, frontmatter, hidden Unicode)
        run: python3 scripts/check_marketplace.py

      - name: README catalog is up to date
        run: python3 scripts/generate_catalog.py --check

      - name: claude plugin validate (marketplace)
        run: claude plugin validate . --strict

      - name: claude plugin validate (each plugin)
        run: |
          status=0
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir}" --strict || status=1
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Changed plugins have a version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py "origin/${BASE_REF}"
